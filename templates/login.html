{% extends 'base.html' %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:100%;max-width:420px" class="fade-in">

    <!-- Logo + titre -->
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--accent) 0%,#0d9668 100%);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-family:'DM Mono',monospace;font-size:18px;color:#fff;box-shadow:0 0 0 1px rgba(16,185,129,.4),0 8px 24px rgba(16,185,129,.25)">FM</div>
      <h1 style="font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;color:var(--text-primary)">Connexion</h1>
      <p style="color:var(--text-secondary);font-size:14px">Accédez à votre espace client</p>
    </div>

    <!-- Formulaire -->
    <div class="card" style="border-radius:var(--radius-lg)">
      <form method="post">
        <div class="form-group">
          <label class="form-label">Adresse email</label>
          <input class="form-input" type="email" name="email" required placeholder="vous@exemple.fr" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input class="form-input" type="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;font-size:15px;padding:13px;margin-top:4px;border-radius:var(--radius-sm)">
          Se connecter
        </button>
      </form>
      <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-secondary)">
        Pas encore de compte ? <a href="/inscription" style="color:var(--accent);font-weight:600">Créer un compte</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
